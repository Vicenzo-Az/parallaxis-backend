name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parallaxis_test
          POSTGRES_USER: parallaxis
          POSTGRES_PASSWORD: parallaxis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DJANGO_SECRET_KEY: ci-test-key
      DJANGO_ENV: dev
      POSTGRES_DB: parallaxis_test
      POSTGRES_USER: parallaxis
      POSTGRES_PASSWORD: parallaxis
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest --cov=apps --cov-report=term-missing
